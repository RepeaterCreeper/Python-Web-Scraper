[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sscraper"
version = "0.1.0"
description = "Image scraper for pages, pagination and infinite feeds with optional DeepFace matching"
requires-python = ">=3.11,<3.16"
dependencies = [
  "PySide6>=6.8,<7; python_version < '3.15'",
  "PySide6>=6.12,<7; python_version >= '3.15'",
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
  "Pillow>=11,<14; python_version < '3.15'",
  "Pillow>=13,<14; python_version >= '3.15'",
  "deepface==0.0.102; python_version < '3.14'",
]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
sscraper = "sscraper.gui:main"
sscraper-cards = "sscraper.csv_viewer:main"

[tool.setuptools.packages.find]
include = ["sscraper*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
