[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-face-finder"
version = "0.1.0"
description = "Local folder face detection and reference-photo matching with DeepFace"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13", "deepface==0.0.102"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
folder-face-finder = "face_finder.gui:main"

[tool.setuptools.packages.find]
include = ["face_finder*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
